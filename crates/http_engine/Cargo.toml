[package]
name = "post-killer-http-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
post-killer-domain = { path = "../domain" }
post-killer-application = { path = "../application" }
reqwest = { version = "0.12", default-features = false, features = ["cookies", "multipart", "rustls-tls", "rustls-tls-native-roots", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
