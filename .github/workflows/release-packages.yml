name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  macos-dmg:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
          - architecture: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          flutter build macos --config-only --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=${GITHUB_REF_NAME#v}"
          # Flutter produces a universal release by default. Invoke Xcode with
          # one ARCHS value so each artifact runs natively on its target Mac.
          xcrun xcodebuild -clonedSourcePackagesDirPath build/macos/SourcePackages -skipPackagePluginValidation -skipPackageSignatureValidation -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -derivedDataPath build/macos -destination 'generic/platform=macOS' OBJROOT=build/macos/Build/Intermediates.noindex SYMROOT=build/macos/Build/Products COMPILER_INDEX_STORE_ENABLE=NO ARCHS="${{ matrix.architecture }}" ONLY_ACTIVE_ARCH=NO
      - run: bash packaging/macos/create_dmg.sh "${GITHUB_REF_NAME#v}" "${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-macos-${{ matrix.architecture }}-dmg
          path: dist/*.dmg

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          flutter build windows --release "--build-name=$version" "--build-number=$env:GITHUB_RUN_NUMBER" "--dart-define=APP_VERSION=$version"
      - run: choco install innosetup --no-progress --yes
      - shell: pwsh
        run: iscc "/DMyAppVersion=$($env:GITHUB_REF_NAME -replace '^v','')" packaging/windows/post_killer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-windows-exe
          path: dist/*-windows-setup.exe

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux build dependencies from Ubuntu repositories
        run: bash packaging/linux/install_dependencies.sh
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          flutter build linux --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=${GITHUB_REF_NAME#v}"
      - run: |
          bash packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"
          bash packaging/linux/build_appimage.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-linux-packages
          path: |
            dist/*.deb
            dist/*.AppImage

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-dmg, windows-exe, linux-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --generate-notes --verify-tag
