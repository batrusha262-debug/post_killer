name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          flutter build macos --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=${GITHUB_REF_NAME#v}"
      - run: |
          bash packaging/macos/create_dmg.sh "${GITHUB_REF_NAME#v}" arm64
          bash packaging/macos/create_dmg.sh "${GITHUB_REF_NAME#v}" x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-macos-dmg
          path: dist/*.dmg

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          flutter build windows --release "--build-name=$version" "--build-number=$env:GITHUB_RUN_NUMBER" "--dart-define=APP_VERSION=$version"
      - run: choco install innosetup --no-progress --yes
      - shell: pwsh
        run: iscc "/DMyAppVersion=$($env:GITHUB_REF_NAME -replace '^v','')" packaging/windows/post_killer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-windows-exe
          path: dist/*-windows-setup.exe

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Linux build dependencies from Ubuntu repositories
        run: bash packaging/linux/install_dependencies.sh
      - working-directory: apps/client_flutter
        run: |
          flutter pub get
          flutter build linux --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER" --dart-define="APP_VERSION=${GITHUB_REF_NAME#v}"
      - run: |
          bash packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"
          bash packaging/linux/build_appimage.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: post-killer-linux-packages
          path: |
            dist/post-killer_*.deb
            dist/Post-Killer-*-linux-x86_64.AppImage

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos-dmg, windows-exe, linux-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate SPDX SBOM for release packages
        uses: anchore/sbom-action@v0
        with:
          path: release-files
          format: spdx-json
          output-file: release-files/post-killer-${{ github.ref_name }}.spdx.json
          artifact-name: post-killer-${{ github.ref_name }}-sbom
          upload-artifact: false
      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release-files/*.dmg
            release-files/*-windows-setup.exe
            release-files/*.deb
            release-files/Post-Killer-*-linux-x86_64.AppImage
      - name: Write package checksums
        run: |
          cd release-files
          sha256sum *.dmg *-windows-setup.exe *.deb Post-Killer-*-linux-x86_64.AppImage > SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 == "## [" version "]" { in_release = 1; next }
            in_release && /^## \[/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "Post Killer $version" \
            --notes-file release-notes.md \
            --verify-tag
